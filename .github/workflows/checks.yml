name: Portfolio checks

on: [push, pull_request]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ['3.10', '3.12']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: portfolio/10-budget-exception-classifier/requirements.txt
      - run: python -m pip install -r portfolio/10-budget-exception-classifier/requirements.txt
      - run: python portfolio/run_checks.py --output-dir "${{ runner.temp }}/finance-reports"
      - uses: actions/upload-artifact@v4
        if: success()
        with:
          name: finance-reports-python-${{ matrix.python-version }}
          path: ${{ runner.temp }}/finance-reports
